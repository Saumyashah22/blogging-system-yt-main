{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f4ee">
    <title>Ink&amp;Insight</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    <script>
        try {
            if (localStorage.getItem('ink-insight-theme') === 'dark') {
                document.documentElement.dataset.theme = 'dark';
            }
        } catch (error) {
            // Keep the default light theme when browser storage is unavailable.
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="{% static 'css/blog.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="site-body">
    <div class="site-shell">
        <header class="blog-header">
            <div class="container">
                <div class="row align-items-center py-3">
                    <div class="col-lg-3 col-md-12 text-center text-lg-left mb-3 mb-lg-0">
                        <a class="brand-mark" href="/">
                            <span class="brand-word brand-word-main">Ink</span><span class="brand-divider">&amp;</span><span class="brand-word brand-word-sub">Insight</span>
                        </a>
                        <span class="brand-tagline">Stories for curious minds</span>
                    </div>
                    <div class="col-lg-5 col-md-7 mb-3 mb-md-0">
                        <form class="site-search" action="{% url 'search' %}" method="GET">
                            <div class="input-group">
                                <input class="form-control" type="text" name="keyword" value="{{ keyword }}" placeholder="Search stories, topics, insights..." aria-label="Search blog posts">
                                <button type="submit" class="btn btn-search" aria-label="Search">Go</button>
                            </div>
                        </form>
                    </div>
                    <div class="col-lg-4 col-md-5 d-flex justify-content-lg-end justify-content-center align-items-center">
                        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
                            <i class="fa fa-moon-o" aria-hidden="true"></i>
                            <span>Dark</span>
                        </button>
                        {% if not user.is_authenticated %}
                        <a class="btn btn-sm btn-auth btn-auth-primary" href="{% url 'login' %}">Login</a>
                        <a class="btn btn-sm btn-auth btn-auth-secondary" href="{% url 'register' %}">Register</a>
                        {% else %}
                        <a class="nav-link-plain" href="{% url 'dashboard' %}">Dashboard</a>
                        <a class="nav-link-plain" href="{% url 'logout' %}">Logout</a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </header>

        <div class="category-bar">
            <div class="container">
                <nav class="category-nav" aria-label="Blog categories">
                    {% for cat in categories %}
                    <a class="category-link" href="{% url 'posts_by_category' cat.id %}">{{ cat.category_name }}</a>
                    {% endfor %}
                </nav>
            </div>
        </div>

        <main class="content-wrap">
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer">
            <div class="container text-center">
                <p>Ink&amp;Insight crafted with <span class="heart">❤</span> by <a href="#">Saumya Shah</a></p>
            </div>
        </footer>
    </div>
    <script src="{% static 'js/theme.js' %}" defer></script>
</body>
</html>
