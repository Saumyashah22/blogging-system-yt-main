{% extends 'base.html' %}


{% block content %}
{% load crispy_forms_tags %}

<div class="container dashboard-layout">
<div class="row">
    <!-- Left sidebar -->
    <!-- load the sidebar here -->
    {% include 'dashboard/sidebar.html' %}

    <!-- Right side content -->
    <div class="col-md-9 dashboard-main">
        <div class="dashboard-titlebar">
            <div>
                <p class="dashboard-eyebrow">Refine your story</p>
                <h1>Edit Blog Post</h1>
            </div>
        </div>
        <form class="dashboard-form-card" action="{% url 'edit_post' post.id %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>
        <br>
    </div>
    </div>
</div>

{% endblock %}
